<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Call | Carbon Sponge</title>
    <meta name="description" content="Tell us about your business and we will set up a short call. No pressure and no obligation. You will leave knowing your next step." />
    <link rel="canonical" href="https://carbonsponge.io/book-a-call/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carbon Sponge" />
    <meta property="og:title" content="Book a Call | Carbon Sponge" />
    <meta property="og:description" content="Tell us about your business and we will set up a short call. No pressure and no obligation. You will leave knowing your next step." />
    <meta property="og:url" content="https://carbonsponge.io/book-a-call/" />
    <meta property="og:image" content="https://carbonsponge.io/og-image.jpg" />
    <meta property="og:image:alt" content="Carbon Sponge logo over an aerial view of a forest river" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static copy of the booking form so Netlify detects "book-a-call" at build time. The live form is rendered by React. -->
    <form name="book-a-call" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="book-a-call" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <select name="industry"><option value="">Industry</option></select>
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="stage"><option value="">Stage</option></select>
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/entry/BookACall.jsx"></script>
  </body>
</html>
